[package]
name = "flightcoach-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform FlightCoach 3D Plotter & Flight Log Analyzer for Desktop, Android, and iOS"

[lib]
name = "flightcoach_app"
crate-type = ["lib", "staticlib"]

[[bin]]
name = "flightcoach"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
pfc-schemas.workspace = true
pfc-geometry.workspace = true
ardupilot-log-reader.workspace = true
pfc-flightdata.workspace = true
pfc-fcscore.workspace = true
pfc-plotting.workspace = true
egui = "0.31"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
